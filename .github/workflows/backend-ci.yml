name: Backend PR validation
on:
  pull_request:
  push:
    branches: [main, develop, feat/s1-f036-f038-favoritos]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['22', '24']
    env:
      NODE_ENV: test
      USE_MOCKS: 'true'
      AUTH_ISSUER: https://security.example.test
      AUTH_JWKS_URL: https://security.example.test/jwks
      # Syntax-only datasource for Prisma validation/generation. No database service.
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/not_connected
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run prisma:validate
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - name: Verify generated OpenAPI
        run: |
          npm run docs:openapi
          git diff --exit-code -- docs/contratos/openapi-h3.json
