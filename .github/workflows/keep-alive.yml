name: Keep-Alive Backend (Render)

# Mitigación de arranque en frío (cold start) en Render
# Tarea: TASK-H5-PERF-007 (Issue #305)
# Solo consulta el servicio propio de G1 (/health) cada 10 minutos.
# IMPORTANTE: GitHub Actions ejecuta eventos `schedule` únicamente desde la rama por defecto (`main`).
# Tras integrar en `develop`, este workflow debe promoverse a `main` para activar las ejecuciones programadas.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-health:
    name: Calentamiento /health (Keep-Alive)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL || 'https://g1-marketplace-backend.onrender.com/health' }}
    steps:
      - name: Sondear /health y medir latencia
        run: |
          ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          metrics=$(curl -s -o /tmp/health.json \
            -w "http_code=%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s" \
            --max-time 90 "$HEALTH_URL" || echo "http_code=000 ttfb=0s total=0s")
          code=$(echo "$metrics" | sed -n 's/.*http_code=\([0-9]*\).*/\1/p')
          echo "[$ts] $HEALTH_URL -> $metrics"

          {
            echo "### Keep-Alive Render — $ts"
            echo "- **URL:** \`$HEALTH_URL\`"
            echo "- **Resultado:** \`$metrics\`"
            echo ""
            echo "\`\`\`json"
            cat /tmp/health.json 2>/dev/null || echo "{}"
            echo ""
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$code" != "200" ]; then
            echo "::warning::Primer intento devolvió HTTP $code; reintentando tras 10s..."
            sleep 10
            code2=$(curl -s -o /tmp/health2.json -w "%{http_code}" --max-time 60 "$HEALTH_URL" || echo "000")
            echo "Reintento -> HTTP $code2"
            if [ "$code2" != "200" ]; then
              echo "::error::/health no respondió 200 (HTTP $code2)"
              exit 1
            fi
          fi
