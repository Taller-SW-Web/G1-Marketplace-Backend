name: H4 G7 contract fixture and persisted sessions
on:
  pull_request:
    paths: ['src/auth/**', 'src/security/**', 'src/config/**', 'src/http/**', 'src/cart/cart.module.ts', 'src/checkout/checkout.module.ts', 'prisma/**', 'test/auth-g7.e2e-spec.ts', 'test/account-g7.e2e-spec.ts', 'test/password-reset-g7.e2e-spec.ts', 'test/g7-introspection.e2e-spec.ts', 'test/recovery-qa.e2e-spec.ts', 'test/g7-prism-contract.test.mjs', 'scripts/security-check.py', 'scripts/install-gitleaks.py', '.security/**', '.github/workflows/auth-h4.yml']
permissions:
  contents: read
jobs:
  auth-session:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: g1_auth_test
          POSTGRES_PASSWORD: temporary_h4_ci_only
          POSTGRES_DB: g1_auth_h4_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U g1_auth_test -d g1_auth_h4_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://g1_auth_test:temporary_h4_ci_only@127.0.0.1:5432/g1_auth_h4_test?schema=public
      AUTH_TEST_DATABASE_URL: postgresql://g1_auth_test:temporary_h4_ci_only@127.0.0.1:5432/g1_auth_h4_test?schema=public
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # Disposable schema only. This does not certify migration deployability;
      # the inherited duplicate-index migration remains a separate deployment gate.
      - run: npx prisma db push --skip-generate
      - run: npm run test:e2e -- test/auth-g7.e2e-spec.ts test/account-g7.e2e-spec.ts test/password-reset-g7.e2e-spec.ts test/g7-introspection.e2e-spec.ts test/recovery-qa.e2e-spec.ts test/auth.e2e-spec.ts
      - run: npm run typecheck
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r .security/requirements.txt
      - run: python scripts/install-gitleaks.py
      - name: Scan source, PR history, build, dependencies and license inventory
        env:
          AUTH_SECURITY_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/security-check.py --base "$AUTH_SECURITY_BASE" --artifact dist
      - name: Sanitized security metadata only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: h4-auth-bff-security
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .local-security/summary.json
            .local-security/licenses.json
  g7-prism-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test against the pinned G7 1.0.0 contract (MOCK)
        run: |
          spec="$RUNNER_TEMP/g7-openapi.yaml"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/Taller-SW-Web/Modulo-de-Seguridad/1b8f2e35448075a6c396b70fdd4ec1d5b1aa9201/specs/openapi.yaml -o "$spec"
          echo "61bf8deb1803b1eb332b55a28b5d73d917654c1229215b2b4ebb51b82796d435  $spec" | sha256sum -c -
          npm exec --yes --package=@stoplight/prism-cli@5.16.0 -- prism mock "$spec" -h 127.0.0.1 -p 4010 > "$RUNNER_TEMP/g7-prism.log" 2>&1 &
          prism_pid=$!
          trap 'kill "$prism_pid" 2>/dev/null || true' EXIT
          if ! curl -fsS --retry 45 --retry-delay 1 --retry-connrefused --max-time 3 http://127.0.0.1:4010/auth/.well-known/jwks.json -o /dev/null; then
            cat "$RUNNER_TEMP/g7-prism.log"
            exit 1
          fi
          node --test test/g7-prism-contract.test.mjs
