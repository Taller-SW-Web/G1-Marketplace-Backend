name: H3 Backend
on:
  push:
    branches: [feat/s1-f006-f007-catalogo]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h3-backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: h3
          POSTGRES_PASSWORD: h3_fixture_only
          POSTGRES_DB: h3_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U h3 -d h3_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://h3:h3_fixture_only@127.0.0.1:5432/h3_ci?schema=public
      CATALOG_SOURCE: mock
      NODE_ENV: test
      CORS_ORIGINS: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.18.0
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run prisma:validate
      - name: Apply baseline migrations to disposable PostgreSQL only
        run: npm run prisma:deploy
      - name: Smoke compiled API and real readiness on disposable DB
        run: node scripts/smoke-h3.mjs
        env:
          H3_EXPECT_DATABASE: up
      - name: Smoke production startup without catalog credentials
        run: node scripts/smoke-h3.mjs
        env:
          H3_SMOKE_MODE: production
          H3_EXPECT_DATABASE: up
      - run: python -m pip install -r .security/requirements.txt
      - run: python scripts/install-gitleaks.py
      - run: python scripts/security-check.py --base e6fc7f25e78a8b34316096839f44863f37f5e2c9 --artifact dist
      - name: Sanitized security evidence (7 days)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: h3-backend-security
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .local-security/summary.json
            .local-security/licenses.json
            .local-security/smoke.json
            .local-security/smoke-production.json
