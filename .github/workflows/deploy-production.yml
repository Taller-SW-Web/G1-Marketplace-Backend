name: Deploy producción (aprobación manual)

# Despliegue del Backend a producción con aprobación obligatoria.
# El job usa el environment `production`, que exige la aprobación de los revisores
# configurados en GitHub (Settings > Environments > production). Hasta que uno
# apruebe, el job queda en «Waiting for review» y NO se despliega.
# Requiere el secreto RENDER_DEPLOY_HOOK_URL y desactivar el Auto-Deploy en Render
# (si no, Render despliega por su cuenta al fusionar a `main`, antes de la aprobación).
# Para verificar que el SHA aprobado quedó Live se usa la API de Render con el secreto
# RENDER_API_KEY; sin él, solo se verifica /health (disponibilidad) y se emite una advertencia.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-production:
    name: Despliegue a producción (requiere aprobación)
    # Solo desde main, también en ejecuciones manuales (workflow_dispatch).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://g1-marketplace-backend.onrender.com/health
    steps:
      - name: Solicitar el despliegue de este commit en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Falta el secreto RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi
          response=$(curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}")
          echo "Despliegue solicitado para ${GITHUB_SHA} (aprobado en el environment production)"
          echo "Respuesta de Render (incluye el ID del despliegue): ${response}"
          { echo "### Despliegue a producción (Backend)"; echo "- Commit: \`${GITHUB_SHA}\`"; echo "- Respuesta de Render: \`${response}\`"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Esperar a que ese despliegue quede Live con el SHA esperado
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-db05v0navr4c73e9mnug
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::warning::Falta RENDER_API_KEY: no se puede confirmar el SHA Live; solo se verificará /health."
            echo "- Verificación del SHA Live: OMITIDA (sin RENDER_API_KEY)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for i in $(seq 1 60); do
            deploy=$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=10" \
              | jq -c --arg sha "$GITHUB_SHA" '[.[] | (.deploy // .)] | map(select(.commit.id == $sha)) | .[0] // empty')
            status=$(echo "$deploy" | jq -r '.status // "no_encontrado"')
            id=$(echo "$deploy" | jq -r '.id // "-"')
            echo "intento $i: despliegue ${id} estado=${status}"
            case "$status" in
              live)
                echo "- Despliegue \`${id}\` Live con el SHA \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::El despliegue ${id} terminó en estado ${status}"
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Tiempo agotado esperando que el despliegue quede Live"
          exit 1

      - name: Verificar que el servicio responde (/health)
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://g1-marketplace-backend.onrender.com/health || true)
            echo "intento $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::/health no respondió 200"
          exit 1
