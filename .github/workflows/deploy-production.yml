name: Deploy producción (aprobación manual)

# Despliegue del Backend a producción con aprobación obligatoria.
# El job usa el environment `production`, que exige la aprobación de los revisores
# configurados en GitHub (Settings > Environments > production). Hasta que uno
# apruebe, el job queda en «Waiting for review» y NO se despliega.
# Requiere el secreto RENDER_DEPLOY_HOOK_URL y desactivar el Auto-Deploy en Render
# (si no, Render despliega por su cuenta al fusionar a `main`, antes de la aprobación).
# Con el secreto RENDER_API_KEY se espera al despliegue concreto que devolvió el hook
# (por su ID) y se comprueba que su commit es el aprobado; sin él, solo se verifica /health.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-production:
    name: Despliegue a producción (requiere aprobación)
    # Solo desde main, también en ejecuciones manuales (workflow_dispatch).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://g1-marketplace-backend.onrender.com/health
    steps:
      - name: Solicitar el despliegue de este commit en Render
        id: hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Falta el secreto RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi
          response=$(curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}")
          deploy_id=$(echo "$response" | jq -r '.deploy.id // .id // empty')
          echo "deploy_id=${deploy_id}" >> "$GITHUB_OUTPUT"
          echo "Despliegue solicitado para ${GITHUB_SHA} (aprobado en el environment production)"
          echo "ID del despliegue devuelto por Render: ${deploy_id:-no disponible}"
          { echo "### Despliegue a producción (Backend)"; echo "- Commit aprobado: \`${GITHUB_SHA}\`"; echo "- ID del despliegue de Render: \`${deploy_id:-no disponible}\`"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Esperar a que ESE despliegue quede Live y confirmar su commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-db05v0navr4c73e9mnug
          DEPLOY_ID: ${{ steps.hook.outputs.deploy_id }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::warning::Falta RENDER_API_KEY: no se puede confirmar el SHA Live; solo se verificará /health."
            echo "- Verificación del SHA Live: OMITIDA (sin RENDER_API_KEY). El SHA activo se confirma en el panel de Render." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Render no devolvió el ID del despliegue; no se puede confirmar cuál quedó Live."
            exit 1
          fi
          for i in $(seq 1 60); do
            deploy=$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}")
            status=$(echo "$deploy" | jq -r '.status // "desconocido"')
            commit=$(echo "$deploy" | jq -r '.commit.id // "-"')
            echo "intento $i: despliegue ${DEPLOY_ID} estado=${status} commit=${commit}"
            case "$status" in
              live)
                if [ "$commit" != "${GITHUB_SHA}" ]; then
                  echo "::error::El despliegue ${DEPLOY_ID} quedó Live con el commit ${commit}, no con el aprobado ${GITHUB_SHA}"
                  exit 1
                fi
                echo "- Despliegue \`${DEPLOY_ID}\` Live con el commit aprobado \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::El despliegue ${DEPLOY_ID} terminó en estado ${status}"
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Tiempo agotado esperando que el despliegue ${DEPLOY_ID} quede Live"
          exit 1

      - name: Verificar que el servicio responde (/health)
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://g1-marketplace-backend.onrender.com/health || true)
            echo "intento $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::/health no respondió 200"
          exit 1
