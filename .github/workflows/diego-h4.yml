name: H4 favoritos and CSAT isolated verification
on:
  pull_request:
    paths: ['src/wishlist/**', 'src/catalog/**', 'src/csat/**', 'src/identity/**', 'src/http/**', 'src/config/**', 'src/app.module.ts', 'prisma/**', 'test/**', 'scripts/test-diego-isolated.mjs', 'scripts/openapi.ts', 'package*.json', '.github/workflows/diego-h4.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/not_connected
      USE_MOCKS: 'true'
      AUTH_ISSUER: https://security.example.test
      AUTH_JWKS_URL: https://security.example.test/jwks
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:diego:isolated
      - run: npm run docs:openapi
      - run: git diff --exit-code -- docs/contratos/openapi-h3.json
