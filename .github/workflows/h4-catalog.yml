name: H4 Catalog Backend
on:
  push:
    branches: [feat/giuliano-hito4]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h4-catalog-backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: h4
          POSTGRES_PASSWORD: h4_fixture_only
          POSTGRES_DB: h4_catalog_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U h4 -d h4_catalog_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://h4:h4_fixture_only@127.0.0.1:5432/h4_catalog_ci?schema=public
      CATALOG_SOURCE: mock
      BFF_MODE: mock
      USE_MOCKS: 'true'
      CORS_ORIGINS: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.18.0
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Verify catalog OpenAPI is reproducible
        run: |
          node scripts/openapi-catalog-h4.mjs
          git diff --exit-code -- docs/contratos/openapi-catalogo-h4.json
      - run: npm run test:unit -- --testPathPatterns=catalog
      - run: npm run test:g6:contract
      - run: npm run test:e2e -- --testPathPatterns=catalog.e2e
      - name: Migrate disposable PostgreSQL from scratch
        run: npm run prisma:deploy
      - name: Compiled API and database readiness smoke
        run: node scripts/smoke-h3.mjs
        env:
          H3_EXPECT_DATABASE: up
      - run: python -m pip install -r .security/requirements.txt
      - run: python scripts/install-gitleaks.py
      - run: python scripts/security-check.py --base 9dc5cfd --artifact dist
      - name: Sanitized security evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: h4-catalog-backend-evidence
          retention-days: 7
          include-hidden-files: true
          path: .local-security/summary.json
