name: H3 F-011 Backend

on:
  push:
    branches: [feat/h3-f011-f015-detalle-de-producto]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h3-f011-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d marketplace_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/marketplace_db?schema=public
      NODE_ENV: test
      USE_MOCKS: 'true'
      # Corte H3: el BFF F-011 opera en MOCK mientras I-01 esté bloqueado.
      BFF_MODE: mock
      AUTH_ISSUER: https://security.example.test
      AUTH_JWKS_URL: https://security.example.test/jwks
      CORS_ORIGINS: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run prisma:deploy
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
