name: marketplace-h5-dast
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dast_fixture
      POSTGRES_PASSWORD: ${DAST_DB_PASSWORD:?}
      POSTGRES_DB: marketplace_dast
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, dast_fixture, -d, marketplace_dast]
      interval: 2s
      retries: 30
    networks: [isolated]
  prism:
    build:
      context: .
      dockerfile: Prism.Dockerfile
    volumes:
      - "${DAST_CONTRACT:?}:/contract/openapi.yaml:ro"
    networks:
      isolated:
        aliases: [marketplace]
  backend:
    build:
      context: "${DAST_SOURCE:?}"
    network_mode: service:prism
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://dast_fixture:${DAST_DB_PASSWORD:?}@postgres:5432/marketplace_dast
      AUTH_ENABLED: "true"
      AUTH_SESSION_KEY: "${DAST_SESSION_KEY:?}"
      G1_WEB_ORIGIN: http://127.0.0.1:10000
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:10000
      G7_API_URL: http://127.0.0.1:4010
      AUTH_ISSUER: auth-service
      G7_REGISTRATION_ENABLED: "true"
      G7_RECOVERY_ENABLED: "true"
      USE_MOCKS: "true"
      CHECKOUT_ADDRESS_SOURCE: prism
      ORDERS_SOURCE: mock
    command: [sh, -ec, "npx prisma db push --skip-generate && node dist/main.js"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:10000/api/v1/password/politica').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30
  frontend:
    build:
      context: "${DAST_FRONTEND:-.}"
    environment:
      MARKETPLACE_API_URL: http://marketplace:10000
      G1_AUTH_ENABLED: "true"
      G1_WEB_ORIGIN: https://marketplace.invalid
      G1_TERMS_URL: https://example.invalid/terms
      G1_PRIVACY_URL: https://example.invalid/privacy
      CHECKOUT_MODE: local-fixtures
      H3_WISHLIST_READ_ENABLED: "true"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks: [isolated]
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    networks: [isolated]
    volumes:
      - "${DAST_RAW:?}:/zap/wrk:rw"
      - "./seed.py:/home/zap/marketplace-seed.py:ro"
networks:
  isolated:
    internal: true
