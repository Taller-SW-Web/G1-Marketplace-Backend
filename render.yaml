databases:
  - name: marketplace-db
    databaseName: marketplace_db
    user: marketplace_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: g1-marketplace-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm run prisma:deploy && npm run start:prod
    healthCheckPath: /live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_ISSUER
        sync: false
      - key: AUTH_JWKS_URL
        sync: false
      - key: G7_API_URL
        sync: false
      - key: G7_SERVICE_CLIENT_ID
        sync: false
      - key: G7_SERVICE_CLIENT_SECRET
        sync: false
      - key: CHECKOUT_SALES_SOURCE
        value: mock
      - key: G5_SALES_INTEGRATION_APPROVED
        value: "false"
      - key: G5_CONTRACT_PRODUCT_FALLBACK_ENABLED
        value: "false"
      - key: VENTAS_BASE_URL
        value: https://g5-api-gateway.onrender.com
      - key: VENTAS_WEBHOOK_HEADER
        value: x-webhook-token
      - key: VENTAS_WEBHOOK_TOKEN
        sync: false
