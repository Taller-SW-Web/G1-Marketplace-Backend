databases:
  - name: marketplace-db
    databaseName: marketplace_db
    user: marketplace_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: g1-marketplace-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    preDeployCommand: npm run prisma:deploy
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
