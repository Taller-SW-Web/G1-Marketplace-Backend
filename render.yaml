databases:
  - name: marketplace-db
    databaseName: marketplace_db
    user: marketplace_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: g1-marketplace-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm run prisma:deploy && npm run start:prod
    healthCheckPath: /live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_ISSUER
        sync: false
      - key: AUTH_JWKS_URL
        sync: false
