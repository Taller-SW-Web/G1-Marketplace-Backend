          "type": "string"
          "enum": ["ITEM_CREATED","ITEM_INCREMENTED"]
          "example": "ITEM_CREATED"
        "data":
          "$ref": "#/components/schemas/CartSnapshot"
    "CartSnapshot":
      "type": "object"
      "additionalProperties": false
      "required": ["cartId","version","items"]
      "properties":
        "cartId":
          "type": "string"
          "format": "uuid"
          "nullable": true
          "description": "Identificador único UUID del carrito."
          "example": "11111111-1111-4111-8111-111111111111"
        "version":
          "type": "integer"
          "minimum": 0
          "description": "Versión incremental del carrito para control de concurrencia optimista."
          "example": 2
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/CartItemSnapshot"
    "CartItemSnapshot":
      "type": "object"
      "additionalProperties": false
      "required": ["sku","quantity"]
      "properties":
        "sku":
          "type": "string"
          "example": "AERO-42-BLK"
        "quantity":
          "type": "integer"
          "minimum": 1
          "maximum": 99
          "example": 1
        "unitPrice":
          "type": "object"
          "additionalProperties": false
          "required": ["amount","currency","version"]
          "properties":
            "amount":
              "type": "number"
              "minimum": 0
              "example": 89.9
            "currency":
              "type": "string"
              "pattern": "^[A-Z]{3}$"
              "example": "PEN"
            "version":
              "type": "integer"
              "minimum": 0
              "example": 1
    "WishlistItemView":
      "type": "object"
      "additionalProperties": false
      "required": ["productId","createdAt","name","slug","brand","image","price","availability"]
      "properties":
        "productId":
          "type": "string"
          "minLength": 1
          "maxLength": 100
        "createdAt":
          "type": "string"
          "format": "date-time"
        "name":
          "type": "string"
          "nullable": true
          "minLength": 1
        "slug":
          "type": "string"
          "nullable": true
          "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        "brand":
          "type": "string"
          "nullable": true
          "minLength": 1
        "image":
          "type": "object"
          "nullable": true
          "additionalProperties": false
          "required": ["url","alt"]
          "properties":
            "url":
              "type": "string"
              "pattern": "^https://"
            "alt":
              "type": "string"
              "minLength": 1
        "price":
          "type": "object"
          "nullable": true
          "additionalProperties": false
          "required": ["amount","currency"]
          "properties":
            "amount":
              "type": "number"
              "minimum": 0
            "currency":
              "type": "string"
              "pattern": "^[A-Z]{3}$"
        "availability":
          "type": "string"
          "enum": ["AVAILABLE","OUT_OF_STOCK","UNDETERMINED","UNAVAILABLE"]
    "AddFromWishlistResult":
      "type": "object"
      "additionalProperties": false
      "required": ["productId","cart"]
      "properties":
        "productId":
          "type": "string"
        "cart":
          "$ref": "#/components/schemas/CartSnapshot"
    "VariantSelectionError":
      "type": "object"
      "additionalProperties": false
      "required": ["code","message","redirectUrl"]
      "properties":
        "code":
          "type": "string"
          "enum": ["VARIANT_SELECTION_REQUIRED"]
        "message":
          "type": "string"
        "redirectUrl":
          "type": "string"
          "pattern": "^/productos/[a-z0-9]+(?:-[a-z0-9]+)*$"
    "WishlistItem":
      "type": "object"
      "additionalProperties": false
      "required": ["productId"]
      "properties":
        "productId":
          "type": "string"
          "minLength": 1
          "maxLength": 100
          "example": "PRD-1"
          "description": "Sin espacios exteriores ni caracteres de control; conserva capitalización."
    "ApiError":
      "type": "object"
      "additionalProperties": false
      "required": ["code","message"]
      "properties":
        "code":
          "type": "string"
        "message":
          "type": "string"
    "Health":
      "type": "object"
      "additionalProperties": false
      "required": ["status","service","environment","database","timestamp"]
      "properties":
        "status":
          "type": "string"
          "enum": ["UP","DOWN"]
        "service":
          "type": "string"
          "example": "g1-marketplace-backend"
        "environment":
          "type": "string"
          "example": "development"
        "database":
          "type": "object"
          "additionalProperties": false
          "required": ["connected"]
          "properties":
            "connected":
              "type": "boolean"
        "timestamp":
          "type": "string"
          "format": "date-time"
    ProductDetailResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ProductDetail'
        meta:
          type: object
          additionalProperties: false
          required: [source, retrievedAt]
          properties:
            source:
              type: string
              enum: [MOCK, PRODUCTS_OFFERS]
              description: MOCK identifica datos de demostración; PRODUCTS_OFFERS es la fuente real post I-01.
            retrievedAt:
              type: string
              format: date-time
    ProductDetail:
      type: object
      additionalProperties: false
      required: [productId, slug, name, brand, technicalSpecifications, media]
      properties:
        productId:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        name:
          type: string
          minLength: 1
          maxLength: 200
        brand:
          $ref: '#/components/schemas/ProductBrand'
        description:
          type: string
          maxLength: 10000
        technicalSpecifications:
          type: array
          items:
            $ref: '#/components/schemas/TechnicalSpecification'
        media:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProductMedia'
    ProductBrand:
      type: object
      additionalProperties: false
      required: [brandId, name]
      properties:
        brandId:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 120
    TechnicalSpecification:
      type: object
      additionalProperties: false
      required: [name, value, displayOrder]
      properties:
        group:
          type: string
        name:
          type: string
          minLength: 1
        value:
          type: string
          minLength: 1
        unit:
          type: string
          nullable: true
        displayOrder:
          type: integer
          minimum: 0
    ProductMedia:
      type: object
      additionalProperties: false
      required: [mediaId, type, url, alt, displayOrder]
      properties:
        mediaId:
          type: string
          minLength: 1
        type:
          type: string
          enum: [IMAGE]
        url:
          type: string
          format: uri
          pattern: '^https://\S+$'
        alt:
          type: string
          minLength: 1
        displayOrder:
          type: integer
          minimum: 0
    ProductPriceResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ProductPrice'
        meta:
          type: object
          additionalProperties: false
          required: [channel, retrievedAt]
          properties:
            channel:
              type: string
              enum: [MARKETPLACE]
            retrievedAt:
              type: string
              format: date-time
    ProductPrice:
      type: object
      additionalProperties: false
      required: [productId, sku, price]
      properties:
        productId:
          type: string
          minLength: 1
        sku:
          type: string
          minLength: 1
        price:
          $ref: '#/components/schemas/Price'
    Price:
      type: object
      additionalProperties: false
      required: [regularAmount, saleAmount, currency, discountPercent, validFrom, validUntil, priceVersion]
      properties:
        regularAmount:
          type: number
          minimum: 0.01
        saleAmount:
          type: number
          minimum: 0.01
          nullable: true
          description: Debe ser menor que regularAmount cuando no es null.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        discountPercent:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: Derivado por el BFF como round((regularAmount - saleAmount) / regularAmount * 100).
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
          nullable: true
          description: No puede ser anterior a validFrom cuando no es null.
        priceVersion:
          type: integer
          minimum: 0
    ProductVariantsResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ProductVariants'
    ProductVariants:
      type: object
      additionalProperties: false
      required: [productId, hasVariants, attributes, variants]
      properties:
        productId:
          type: string
          minLength: 1
        hasVariants:
          type: boolean
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/VariantAttribute'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
      description: >-
        Si hasVariants=false, attributes y variants deben ser arreglos vacíos.
        Si hasVariants=true, ambos deben tener al menos un elemento.
    VariantAttribute:
      type: object
      additionalProperties: false
      required: [id, label, values]
      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        values:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VariantAttributeValue'
    VariantAttributeValue:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
    ProductVariant:
      type: object
      additionalProperties: false
      required: [variantId, sku, status, attributes, image]
      properties:
        variantId:
          type: string
          minLength: 1
        sku:
          type: string
          minLength: 1
        status:
          type: string
          enum: [ACTIVE]
        attributes:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
            minLength: 1
        image:
          type: object
          nullable: true
          additionalProperties: false
          required: [url, alt]
          properties:
            url:
              type: string
              format: uri
              pattern: '^https://\S+$'
            alt:
              type: string
              minLength: 1
    ProductAvailabilityResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ProductAvailability'
    ProductAvailability:
      type: object
      additionalProperties: false
      required: [productId, sku, availability, checkedAt]
      properties:
        productId:
          type: string
          minLength: 1
        sku:
          type: string
          minLength: 1
        availability:
          type: string
          enum: [AVAILABLE, STOCK_LOW, OUT_OF_STOCK, UNDETERMINED]
          description: >-
            UNDETERMINED indica disponibilidad por confirmar, con reintento y sin
            compra. Un error externo nunca se convierte en estado comercial.
        checkedAt:
          type: string
          format: date-time
    RecommendationsResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/RecommendationCard'
        meta:
          type: object
          additionalProperties: false
          required: [sourceProductId]
          properties:
            sourceProductId:
              type: string
              minLength: 1
    RecommendationCard:
      type: object
      additionalProperties: false
      required: [productId, slug, name, image, type, price, presentationOrder]
      properties:
        productId:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        name:
          type: string
          minLength: 1
        image:
          $ref: '#/components/schemas/RecommendationImage'
        type:
          type: string
          enum: [CROSS_SELL, UPSELL]
        price:
          type: object
          nullable: true
          additionalProperties: false
          required: [amount, currency]
          properties:
            amount:
              type: number
              minimum: 0.01
            currency:
              type: string
              pattern: '^[A-Z]{3}$'
        presentationOrder:
          type: integer
          minimum: 0
    RecommendationImage:
      type: object
      additionalProperties: false
      required: [url, alt]
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://\S+$'
        alt:
          type: string
          minLength: 1
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, code, instance, requestId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          minLength: 1
          description: Código estable del contrato; nunca un código interno del proveedor.
        detail:
          type: string
          description: Mensaje propio de Marketplace; nunca datos del proveedor.
        instance:
          type: string
          minLength: 1
        requestId:
          type: string
          minLength: 1
  responses:
    AuthInvalidRequest:
      description: Solicitud inválida (validación de campos o cuerpo no permitido)
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: '#/components/schemas/ValidationError' }
              - { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: La operación no se hizo desde el frontend de Marketplace (Origin) o la contraseña caducó
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: FORBIDDEN, message: 'Realiza esta operación desde Marketplace.' }
    EmailUnavailable:
      description: El correo no está disponible (mensaje genérico)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: CORREO_NO_DISPONIBLE, message: 'No pudimos completar el acceso.' }
    PolicyViolated:
      description: La contraseña no cumple la política vigente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: POLITICA_INCUMPLIDA, message: 'No pudimos completar el acceso.' }
    RateLimited:
      description: Demasiadas solicitudes
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: RATE_LIMITED, message: 'Espera antes de volver a intentarlo.', retryAfterSeconds: 60 }
    ChallengeExpired:
      description: El desafío MFA venció o no existe; hay que volver a iniciar sesión
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: OTP_EXPIRADO, message: 'Vuelve a iniciar sesión.' }
    AuthUnavailable:
      description: Acceso no disponible temporalmente (G7 caído, tiempo agotado u operación apagada)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: AUTH_UNAVAILABLE, message: 'Acceso no disponible temporalmente.' }

    CheckoutInvalidRequest:
      description: >-
        DTO inválido o clave de idempotencia ausente/inválida. El código identifica
        la causa; `fields` puede enumerar campos de DTO rechazados.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Autenticación inválida o ausente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    CheckoutConflict:
      description: >-
        Carrito/cotización/contexto/stock en conflicto, estado no preparado o
        reutilización incompatible de una clave de idempotencia.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unprocessable:
      description: Beneficio no aplicable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    CheckoutUnavailable:
      description: >-
        Proveedor no disponible, timeout mapeado por el BFF o configuración de
        autenticación no disponible. En creación de pedido una respuesta incierta
        puede ser 202 o 409 ORDER_CREATION_PENDING; nunca se interpreta como pago exitoso.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Recurso no encontrado o fuera del contexto/propiedad del titular
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InvalidProductSlug:
      description: 400 INVALID_PRODUCT_SLUG — el slug no cumple el patrón canónico
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-Catalog-Source:
          $ref: '#/components/headers/XCatalogSource'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            slugInvalido:
              value:
                type: https://marketplace.example.com/problems/invalid-product-slug
                title: El slug no cumple el formato definido.
                status: 400
                code: INVALID_PRODUCT_SLUG
                instance: /api/v1/catalog/products/SLUG_INVALIDO!
                requestId: 0f873b84-ae5d-4cd2-a530-f88672e4af85
    ProductNotFound:
      description: 404 PRODUCT_NOT_AVAILABLE — producto inexistente, inactivo o no elegible
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-Catalog-Source:
          $ref: '#/components/headers/XCatalogSource'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            noDisponible:
              value:
                type: https://marketplace.example.com/problems/product-not-available
                title: Producto no disponible
                status: 404
                code: PRODUCT_NOT_AVAILABLE
                instance: /api/v1/catalog/products/producto-no-existente-mock
                requestId: 0f873b84-ae5d-4cd2-a530-f88672e4af85
    ProductDetailConflict:
      description: 409 — selección de variante requerida o SKU ajeno al producto
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-Catalog-Source:
          $ref: '#/components/headers/XCatalogSource'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            seleccionRequerida:
              value:
                type: https://marketplace.example.com/problems/product-variant-selection-required
                title: Selecciona una variante antes de consultar el precio.
                status: 409
                code: PRODUCT_VARIANT_SELECTION_REQUIRED
                instance: /api/v1/catalog/products/producto-variable-mock/price
                requestId: 0f873b84-ae5d-4cd2-a530-f88672e4af85
            skuAjeno:
              value:
                type: https://marketplace.example.com/problems/sku-not-belong-to-product
                title: El SKU no corresponde a este producto.
                status: 409
                code: SKU_NOT_BELONG_TO_PRODUCT
                instance: /api/v1/catalog/products/producto-variable-mock/price?sku=SKU-MOCK-001
                requestId: 0f873b84-ae5d-4cd2-a530-f88672e4af85
    PriceNotAvailable:
      description: 422 PRICE_NOT_AVAILABLE — no hay precio comercial vigente para el SKU
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-Catalog-Source:
          $ref: '#/components/headers/XCatalogSource'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            sinPrecio:
              value:
                type: https://marketplace.example.com/problems/price-not-available
                title: Precio no disponible por el momento.
                status: 422
                code: PRICE_NOT_AVAILABLE
                instance: /api/v1/catalog/products/producto-variable-mock/price?sku=SKU-MOCK-VAR-3
                requestId: 0f873b84-ae5d-4cd2-a530-f88672e4af85
    ProductDetailInvalidResponse:
      description: 502 PRODUCT_CATALOG_INVALID_RESPONSE — ficha fuera de contrato
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-Catalog-Source:
          $ref: '#/components/headers/XCatalogSource'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            fichaInvalida:
              value:
                type: https://marketplace.example.com/problems/product-catalog-invalid-response
                title: Respuesta inválida del catálogo.
                status: 502
                code: PRODUCT_CATALOG_INVALID_RESPONSE
                instance: /api/v1/catalog/products/zapatillas-running-aero-x
                requestId: 0f873b84-ae5d-4cd2-a530-f88672e4af85
    ProductDetailUnavailable:
      description: 503 PRODUCT_CATALOG_UNAVAILABLE — no se obtuvo una ficha utilizable
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-Catalog-Source:
          $ref: '#/components/headers/XCatalogSource'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            catalogoNoDisponible:
              value:
                type: https://marketplace.example.com/problems/product-catalog-unavailable
                title: El catálogo no está disponible.
                status: 503
                code: PRODUCT_CATALOG_UNAVAILABLE
                instance: /api/v1/catalog/products/producto-error-503-mock
                requestId: 0f873b84-ae5d-4cd2-a530-f88672e4af85
    ProductDetailTimeout:
      description: 504 PRODUCT_CATALOG_TIMEOUT — el origen agotó el tiempo de espera
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-Catalog-Source:
          $ref: '#/components/headers/XCatalogSource'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            catalogoLento:
              value:
                type: https://marketplace.example.com/problems/product-catalog-timeout
                title: El catálogo tardó demasiado en responder.
                status: 504
                code: PRODUCT_CATALOG_TIMEOUT
                instance: /api/v1/catalog/products/producto-error-504-mock
                requestId: 0f873b84-ae5d-4cd2-a530-f88672e4af85
    PriceInvalidResponse:
      description: 502 PRICING_INVALID_RESPONSE — importes, moneda o vigencia inválidos
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-Catalog-Source:
          $ref: '#/components/headers/XCatalogSource'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            precioInvalido:
              value:
                type: https://marketplace.example.com/problems/pricing-invalid-response
                title: La respuesta de precios no es válida.
                status: 502
                code: PRICING_INVALID_RESPONSE
                instance: /api/v1/catalog/products/producto-error-502-precio-mock/price
                requestId: 0f873b84-ae5d-4cd2-a530-f88672e4af85
    PriceUnavailable:
      description: 503 PRICING_UNAVAILABLE — no se obtuvo una respuesta de precios utilizable
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-Catalog-Source:
          $ref: '#/components/headers/XCatalogSource'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            preciosNoDisponibles:
              value:
                type: https://marketplace.example.com/problems/pricing-unavailable
                title: El servicio de precios no está disponible.
                status: 503
                code: PRICING_UNAVAILABLE
                instance: /api/v1/catalog/products/producto-error-503-precio-mock/price
                requestId: 0f873b84-ae5d-4cd2-a530-f88672e4af85
    PriceTimeout:
      description: 504 PRICING_TIMEOUT — el servicio de precios agotó el tiempo de espera
      headers:
