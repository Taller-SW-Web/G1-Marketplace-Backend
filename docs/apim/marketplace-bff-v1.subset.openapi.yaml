                      sku: SKU-MOCK-001
                      availability: AVAILABLE
                      checkedAt: '2026-11-04T12:00:00.000Z'
                stockBajo:
                  summary: Variante con stock bajo
                  value:
                    data:
                      productId: PRD-VAR-MOCK-001
                      sku: SKU-MOCK-VAR-2
                      availability: STOCK_LOW
                      checkedAt: '2026-11-04T12:00:00.000Z'
        '400':
          $ref: '#/components/responses/InvalidProductSlug'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          $ref: '#/components/responses/ProductDetailConflict'
        '502':
          $ref: '#/components/responses/AvailabilityInvalidResponse'
        '503':
          $ref: '#/components/responses/AvailabilityUnavailable'
        '504':
          $ref: '#/components/responses/AvailabilityTimeout'
  "/v1/catalog/products/{slug}/recommendations":
    get:
      operationId: getProductRecommendations
      tags: [Comercial]
      summary: Listar productos relacionados completos y deduplicados
      parameters:
        - $ref: '#/components/parameters/ProductSlug'
      x-traceability:
        feature: F-015
        implementation: 'ProductRecommendationsController.getRecommendations -> ProductRecommendationsService.getRecommendations'
        authentication: 'Pública; no requiere Authorization.'
        behavior: >-
          Región no crítica: devuelve como máximo 8 tarjetas completas, activas
          y deduplicadas, sin el producto de origen. Un candidato incompleto se
          omite y un fallo técnico se degrada a 200 con arreglo vacío. Sólo un
          slug fuera del patrón canónico responde 400.
        errorCodes:
          '400': [INVALID_PRODUCT_SLUG]
        runtimeEvidence: 'MOCK; no acredita integración REAL ni despliegue.'
      responses:
        '200':
          description: Tarjetas relacionadas o arreglo vacío por ausencia o degradación
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Catalog-Source:
              $ref: '#/components/headers/XCatalogSource'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'
              examples:
                conRelacionados:
                  summary: Cuatro tarjetas relacionadas
                  value:
                    data:
                      - productId: mock-product-1
                        slug: producto-demostracion-1
                        name: Zapatillas de running 01
                        image:
                          url: https://placehold.co/600x400?text=1A
                          alt: Zapatillas de running 01 [MOCK]
                        type: CROSS_SELL
                        price:
                          amount: 89.9
                          currency: PEN
                        presentationOrder: 1
                      - productId: mock-product-2
                        slug: producto-demostracion-2
                        name: Polo de entrenamiento 02
                        image:
                          url: https://placehold.co/600x400?text=2A
                          alt: Polo de entrenamiento 02 [MOCK]
                        type: UPSELL
                        price: null
                        presentationOrder: 2
                    meta:
                      sourceProductId: PRD-MOCK-001
                sinRelacionados:
                  summary: Degradación válida a arreglo vacío
                  value:
                    data: []
                    meta:
                      sourceProductId: PRD-MOCK-NONE
        '400':
          $ref: '#/components/responses/InvalidProductSlug'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: g1_session
      description: >-
        Cookie de sesión opaca en desarrollo y pruebas (NODE_ENV distinto de
        production). HttpOnly, SameSite=Lax, Path=/ y vigencia de 7 días. En
        producción el navegador usa sessionCookieProd. Contiene solo un
        identificador: los tokens de G7 viven cifrados en el servidor.
    sessionCookieProd:
      type: apiKey
      in: cookie
      name: __Host-g1_session
      description: >-
        La misma cookie de sesión con el nombre que usa NODE_ENV=production
        (G7SessionService.cookieName antepone __Host-). Además de HttpOnly,
        SameSite=Lax, Path=/ y 7 días, lleva el atributo Secure. Es una alternativa
        de sessionCookie: en cada entorno aplica solo una de las dos.
    challengeCookie:
      type: apiKey
      in: cookie
      name: g1_challenge
      description: >-
        Cookie del desafío MFA pendiente en desarrollo y pruebas. HttpOnly,
        SameSite=Lax, Path=/ y vigencia igual a expiraEn (hasta 300 s). Se emite en
        el login con MFA y se elimina al verificar el código. En producción el
        navegador usa challengeCookieProd.
    challengeCookieProd:
      type: apiKey
      in: cookie
      name: __Host-g1_challenge
      description: >-
        La misma cookie de desafío MFA con el nombre de producción (prefijo
        __Host-) y el atributo Secure. Alternativa de challengeCookie según el
        entorno.
    CheckoutbearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    "H3bearerAuth":
      "type": "http"
      "scheme": "bearer"
      "bearerFormat": "JWT"
  parameters:
    OriginHeader:
      name: Origin
      in: header
      required: true
      description: >-
        Debe coincidir con el origen del frontend de Marketplace (G1_WEB_ORIGIN) y
        Sec-Fetch-Site no puede ser cross-site; de lo contrario responde 403
        FORBIDDEN. El navegador lo envía automáticamente.
      schema: { type: string, example: 'https://g1-marketplace-frontend.vercel.app' }
    PreparationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID persistida por titular; el fingerprint debe coincidir al reintentar.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    OrderIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID versión 4; la misma clave y solicitud recuperan el resultado original.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    ProductSlug:
      name: slug
      in: path
      required: true
      description: Slug canónico del producto (1 a 120 caracteres).
      schema:
        type: string
        minLength: 1
        maxLength: 120
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      example: zapatillas-running-aero-x
    OptionalSku:
      name: sku
      in: query
      required: false
      description: >-
        SKU vendible. Es obligatorio para productos con variantes y, si se
        envía, debe pertenecer al producto.
      schema:
        type: string
        minLength: 1
        maxLength: 100
      example: SKU-MOCK-001
  schemas:
    Capabilities:
      type: object
      required: [login, registro, recuperacion]
      properties:
        login: { type: boolean }
        registro: { type: boolean }
        recuperacion: { type: boolean }
    PasswordPolicy:
      type: object
      required: [longitudMinima, requiereMayuscula, requiereMinuscula, requiereDigito, requiereCaracterEspecial, historial]
      properties:
        longitudMinima: { type: integer, minimum: 1, maximum: 256 }
        requiereMayuscula: { type: boolean }
        requiereMinuscula: { type: boolean }
        requiereDigito: { type: boolean }
        requiereCaracterEspecial: { type: boolean }
        historial: { type: integer, minimum: 0 }
        rechazaComunes: { type: boolean }
        rechazaDatosPersonales: { type: boolean }
    RegistrationInput:
      type: object
      additionalProperties: false
      required: [correo, contrasena, nombres, apellidos, celular, aceptaTerminos]
      properties:
        correo: { type: string, format: email, maxLength: 254 }
        contrasena: { type: string, minLength: 1, maxLength: 256 }
        nombres: { type: string, maxLength: 100, pattern: '\S', description: 'Debe contener al menos un carácter no blanco' }
        apellidos: { type: string, maxLength: 100, pattern: '\S', description: 'Debe contener al menos un carácter no blanco' }
        celular: { type: string, pattern: '^\+51[0-9]{9}$', example: '+51987654321' }
        aceptaTerminos: { type: boolean, enum: [true] }
    RegistrationAccepted:
      type: object
      required: [id, estado]
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F-]{36}$'
          description: 'Identificador devuelto por G7: cadena de 36 caracteres hexadecimales o guiones (el BFF no exige formato UUID estricto)'
        estado: { type: string, enum: [PENDIENTE_VERIFICACION] }
    RecoveryInput:
      type: object
      additionalProperties: false
      required: [correo]
      properties:
        correo: { type: string, format: email, maxLength: 254 }
    ResetInput:
      type: object
      additionalProperties: false
      required: [token, nuevaContrasena]
      properties:
        token: { type: string, minLength: 1, maxLength: 2048 }
        nuevaContrasena: { type: string, minLength: 1, maxLength: 256 }
    LoginInput:
      type: object
      additionalProperties: false
      required: [correo, contrasena]
      properties:
        correo: { type: string, format: email, maxLength: 254 }
        contrasena: { type: string, minLength: 1, maxLength: 256 }
    VerifyOtpInput:
      type: object
      additionalProperties: false
      required: [codigo]
      properties:
        codigo: { type: string, pattern: '^\d{6}$', example: '123456' }
    MfaChallenge:
      type: object
      required: [mfaRequerido, canal, expiraEn]
      properties:
        mfaRequerido: { type: boolean, enum: [true] }
        canal: { type: string, enum: [EMAIL] }
        expiraEn: { type: integer, minimum: 1, maximum: 300, description: Segundos de vigencia del desafío }
    MockLogin:
      type: object
      description: >-
        Resultado de demostración de AuthService.login. Solo existe con H3_AUTH_MOCK=true
        fuera de producción y con AUTH_ENABLED apagado; nunca crea sesión ni cookie.
      required: [mode, authenticated, message]
      properties:
        mode: { type: string, enum: [MOCK] }
        authenticated: { type: boolean, enum: [false] }
        message: { type: string }
    OtpRequested:
      type: object
      required: [canal, destinoEnmascarado, expiraEn, desafioExpiraEn]
      properties:
        canal: { type: string, enum: [EMAIL] }
        destinoEnmascarado: { type: string, maxLength: 254, example: 'c***@correo.com' }
        expiraEn: { type: number, description: Segundos de vigencia del código (G7 los entrega como número) }
        desafioExpiraEn: { type: number, description: Segundos restantes del desafío (G7 los entrega como número) }
    SessionUser:
      type: object
      required: [id, nombreCompleto, roles]
      properties:
        id: { type: string, description: Identificador (sub) del usuario en G7 }
        nombreCompleto: { type: string, maxLength: 200 }
        roles: { type: array, items: { type: string }, example: [CLIENTE] }
    Session:
      type: object
      required: [authenticated, user, scope]
      properties:
        authenticated: { type: boolean, enum: [true] }
        user: { $ref: '#/components/schemas/SessionUser' }
        scope: { type: string, format: uuid, description: Identificador de la sesión para aislar datos en el cliente }
    AnonymousSession:
      type: object
      required: [authenticated, scope]
      properties:
        authenticated: { type: boolean, enum: [false] }
        scope: { type: string, enum: [anonymous] }
    LoggedOut:
      type: object
      required: [authenticated, remoteRevocationPending]
      properties:
        authenticated: { type: boolean, enum: [false] }
        remoteRevocationPending: { type: boolean, description: 'true si el cierre local se completó pero no se pudo confirmar la revocación en G7' }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: Código estable para integradores }
        message: { type: string, description: 'Mensaje genérico, sin datos de cuenta' }
        retryAfterSeconds: { type: integer, description: Presente en 429 }
    ValidationError:
      type: object
      description: Formato por defecto del ValidationPipe de NestJS.
      properties:
        statusCode: { type: integer, example: 400 }
        message: { type: array, items: { type: string } }
        error: { type: string, example: Bad Request }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code: { type: string, minLength: 1 }
            fields:
              type: array
              items: { type: string }
    AddressInput:
      type: object
      additionalProperties: false
      required: [street, district, province, department, phone]
      properties:
        label: { type: string, maxLength: 80 }
        street: { type: string, minLength: 1, maxLength: 180 }
        district: { type: string, minLength: 1, maxLength: 100 }
        province: { type: string, minLength: 1, maxLength: 100 }
        department: { type: string, minLength: 1, maxLength: 100 }
        reference: { type: string, maxLength: 180 }
        phone: { type: string, minLength: 1, maxLength: 40 }
    Address:
      type: object
      additionalProperties: false
      required: [addressId, street, district, province, department]
      properties:
        addressId: { type: string, minLength: 1 }
        label: { type: string, maxLength: 80 }
        street: { type: string, minLength: 1, maxLength: 180 }
        district: { type: string, minLength: 1, maxLength: 100 }
        province: { type: string, minLength: 1, maxLength: 100 }
        department: { type: string, minLength: 1, maxLength: 100 }
        reference: { type: string, maxLength: 180 }
    AddressResult:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Address' }
    AddressList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Address' }
    QuoteInput:
      type: object
      additionalProperties: false
      required: [addressId, cartVersion]
      properties:
        addressId: { type: string, minLength: 1, maxLength: 100 }
        cartVersion: { type: integer, minimum: 0 }
    BenefitInput:
      type: object
      additionalProperties: false
      required: [quoteId]
      properties:
        quoteId: { type: string, minLength: 1, maxLength: 100 }
        couponCode: { type: string, maxLength: 30 }
    PrepareInput:
      type: object
      additionalProperties: false
      required: [quoteId, cartVersion, simulationConfirmed]
      properties:
        quoteId: { type: string, minLength: 1, maxLength: 100 }
        cartVersion: { type: integer, minimum: 0 }
        simulationConfirmed: { type: boolean }
    OrderInput:
      type: object
      additionalProperties: false
      required: [checkoutOperationId, contact]
      properties:
        checkoutOperationId: { type: string, format: uuid }
        contact:
          type: object
          additionalProperties: false
          required: [fullName, documentType, documentNumber, phone, email]
          properties:
            fullName: { type: string, minLength: 2, maxLength: 120 }
            documentType: { type: string, enum: [DNI, RUC, CE, PASAPORTE] }
            documentNumber: { type: string, minLength: 5, maxLength: 24 }
            phone: { type: string, minLength: 5, maxLength: 40 }
            email: { type: string, format: email, maxLength: 254 }
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: { type: number, minimum: 0 }
        currency: { type: string, enum: [PEN] }
    QuoteLine:
      type: object
      additionalProperties: false
      required: [sku, quantity]
      properties:
        sku: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 1 }
    SelectedBenefit:
      type: object
      additionalProperties: false
      required: [type, id, discount]
      properties:
        type: { type: string, enum: [COUPON] }
        id: { type: string, minLength: 1 }
        discount: { $ref: '#/components/schemas/Money' }
    QuoteResult:
      type: object
      description: Cotización recalculada por el servidor a partir del carrito y proveedor.
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [quoteId, expiresAt, subtotal, discount, shipping, total, lines, addressId, cartVersion]
          properties:
            quoteId: { type: string, minLength: 1 }
            expiresAt: { type: string, format: date-time }
            subtotal: { $ref: '#/components/schemas/Money' }
            discount: { $ref: '#/components/schemas/Money' }
            shipping:
              type: object
              additionalProperties: false
              required: [amount, currency, estimatedDays]
              properties:
                amount: { type: number, minimum: 0 }
                currency: { type: string, enum: [PEN] }
                estimatedDays: { type: number, minimum: 0 }
            total: { $ref: '#/components/schemas/Money' }
            lines:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/QuoteLine' }
            addressId: { type: string, minLength: 1 }
            cartVersion: { type: integer, minimum: 0 }
            selectedBenefit: { $ref: '#/components/schemas/SelectedBenefit' }
    CheckoutOperation:
      type: object
      required: [checkoutOperationId, state]
      properties:
        checkoutOperationId: { type: string, format: uuid }
        state: { type: string, enum: [PREPARED, SUBMITTED, SUCCEEDED, FAILED] }
        orderId: { type: string, pattern: '^PED-[0-9]{4}-[0-9]{5}$' }
        orderState: { type: string, enum: [CREADO, PAGADO, ANULADO] }
        total: { $ref: '#/components/schemas/Money' }
        createdAt: { type: string, format: date-time }
        revalidatedAt: { type: string, format: date-time }
        simulationConsent: { type: string, enum: [RECORDED] }
        failureCode: { type: string }
        recoveryRequired: { type: boolean }
    OperationResult:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/CheckoutOperation'
    CheckoutOperationStatus:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, enum: [PREPARED, SUBMITTED, SUCCEEDED, FAILED] }
        order:
          type: object
          required: [orderId, state, total, createdAt]
          properties:
            orderId: { type: string, pattern: '^PED-[0-9]{4}-[0-9]{5}$' }
            state: { type: string, enum: [CREADO, PAGADO, ANULADO] }
            total: { $ref: '#/components/schemas/Money' }
            createdAt: { type: string, format: date-time }
        failureCode: { type: string }
        recoveryRequired: { type: boolean }
    OperationStatusResult:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/CheckoutOperationStatus' }

