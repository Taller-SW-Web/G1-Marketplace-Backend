name: marketplace-h5-webhook-tests
services:
  postgres-h5-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: h5_test
      POSTGRES_PASSWORD: h5_local_test_only
      POSTGRES_DB: marketplace_h5_webhook_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U h5_test -d marketplace_h5_webhook_test"]
      interval: 2s
      timeout: 3s
      retries: 30
