name: marketplace-security-events-test
services:
  postgres-security-events-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: security_events_test
      POSTGRES_PASSWORD: security_events_local_only
      POSTGRES_DB: marketplace_security_events_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security_events_test -d marketplace_security_events_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
